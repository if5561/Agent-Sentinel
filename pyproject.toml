[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sentinel"
version = "0.1.0"
description = "Minimal LangChain single-turn chat service with Feishu alerting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.60",
  "lark-oapi>=1.4.18",
  "openai>=1.58.0",
  "pymilvus>=2.4.10",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "redis>=5.2.0",
  "requests>=2.32.0",
  "aiohttp>=3.10.0",
  "cachetools>=5.5.0",
  "tenacity>=8.5.0",
  "prometheus-client>=0.21.0",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
]

[project.scripts]
agent-sentinel = "agent_sentinel.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
